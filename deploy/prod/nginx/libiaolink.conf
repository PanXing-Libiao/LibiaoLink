# ============================================================
# LibiaoLink 生产站点（Nginx · deploy/prod web 容器）
# ------------------------------------------------------------
# 现状（2026-10-14）：TLS 接入 —— 80 → 301；443 = 应用 + 对象存储同源门面（/libiaolink/）；9443 = MinIO 备用门面。
#   证书：ALLinSSL 下发 *.libiaorobot.com → 宿主 /etc/ssl/…（compose 只读挂载到 /etc/nginx/ssl/）。
# 反代口径（与 frontend/vite.config.ts 开发代理一致；M8 §4.5）：
#   /api/v1、/auth、/healthz、/readyz → http://api:3000
#   /internal/** 为内部同步口：不配置反代（落 SPA 404）。
# 对象存储门面（预签名直传 / 预览 / 下载）：主通道 = 443 同源路径 /libiaolink/（= S3_BUCKET 名）；
#   客户端网络仅放行 22/80/443，9443 / 9000 被安全策略拦截（2026-10-14 实测）→ S3_ENDPOINT 用
#   https://test-pm.libiaorobot.com（默认端口 → 签名 host 不含端口）。proxy_pass 不带 URI、Host
#   原样透传（$http_host），保证 SigV4 的 host / path 与签名一致；9443 保留为内网备用门面。
# ONLYOFFICE 门面（2026-10-14）：443 /onlyoffice/ → libiaolink-onlyoffice-docs（子路径反代 —— DS 9.4 原生
#   支持：X-Forwarded-Prefix 生成带前缀重定向；wss（Upgrade）透传；/example/ 恒 404）。
# 证书更新：ALLinSSL 原地覆盖 /etc/ssl 两文件 → sudo /usr/local/bin/allinssl-reload
#   （单文件 bind mount 绑定 inode，原地覆盖容器可见；若遇旧证书未生效 → 改挂目录或重启容器）。
# ============================================================
# ---- 容器 DNS 动态解析（upstream resolve，开源版 nginx ≥ 1.27.3）----
# api / minio 容器重建换 IP 后自动跟上，无需重启本容器（根治「重建后 502」）。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
  zone api_backend 64k;
  server api:3000 resolve;
  # Push 323（2026-10-14）上游长连接池：显式开启 + 空闲上限压在 Node 之前。
  # 背景：Node（api）默认 server.keepAliveTimeout = 5s，空闲连接由 Node 侧先关；nginx 复用到
  # 「已被对端关闭、本端尚未感知」的旧连接会偶发 502（sendfile() failed (104: Connection
  # reset by peer) / upstream prematurely closed —— Push 321 真机验证取消链路时复现）。
  # 口径：idle ≤ 4s 才可能被复用（1s 余量）→ 永不撞上 Node 的 5s 关门时刻。
  keepalive 32;
  keepalive_timeout 4s;
}

upstream minio_backend {
  zone minio_backend 64k;
  server minio:9000 resolve;
}


upstream onlyoffice_backend {
  zone onlyoffice_backend 64k;
  server libiaolink-onlyoffice-docs:80 resolve;
}

# ---- 80：仅健康探活 + 301 跳转 https（旧 http://10.1.104.44 一并收口）----
server {
  listen 80;
  server_name _;

  server_tokens off;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://test-pm.libiaorobot.com$request_uri;
  }
}

# ---- 443：应用（SPA + api 反代）----
server {
  listen 443 ssl;
  http2 on;
  server_name test-pm.libiaorobot.com;

  ssl_certificate     /etc/nginx/ssl/libiaorobot.com.pem;
  ssl_certificate_key /etc/nginx/ssl/libiaorobot.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;

  server_tokens off;
  client_max_body_size 32m;

  # H1 S5 / F-06（2026-10-21 / 2026-10-23）：HTTPS 全站安全头。Nginx 的 add_header
  # 不向后代继承「父级已有、子级也新增」的场景；下方自带 add_header 的 SPA / 对象存储 /
  # CAD 静态 location 会显式重复同一套头，避免只生效一部分。
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # F-06（2026-10-23）：API / 错误响应统一安全头；Express 侧也已关闭 X-Powered-By。
  # proxy_hide_header 保证上游同名头只落一套，避免 401 / 404 / 500 叠加。
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  proxy_hide_header X-Powered-By;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;

  # 探活（https 侧同口径；容器 healthcheck 走容器内 80）
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 反代公共头（server 级继承给各 location）
  proxy_http_version 1.1;
  # 置空 Connection：上游长连接（api_backend keepalive）的配套要求——不向被代服务透传 Connection 头。
  # 现状＝server 级 proxy_set_header 已覆盖 nginx 默认 Connection: close（连接实际保持长连并被复用），
  # 此处显式固化；onlyoffice 自带 Connection: upgrade 覆盖本行，minio 无 keepalive 声明、行为不变。
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # ---- 反代 api（compose 网络内服务名 api）----
  # /api/v1 请求体上限 32m → 257m：导入表 preview 单包上传（应用整包上限 256 MiB = IMPORT_MAX_FILE_BYTES；
  # 留 1m 余量 → 超限文件由应用回 JSON 400，而不是 nginx 直接 413）；其余路径仍守 server 级 32m。
  # /api/v1 读写超时 60s → 300s（Push 348 · 2026-10-16）：老表导入 commit 逐张传图（151 张 ≈ 60s+）会被
  # server 级 60s 掐断成 504（客户端误报失败；api 侧按取消语义清理已传对象、无残留）；300s 留慢日余量。
  # F-06（2026-10-23）：preview-content 是 DocServer 服务间拉取口，DocServer 直连容器内
  # API（ONLYOFFICE_DOCSERVER_API_BASE_URL=http://api:3000），公网入口一律 404。
  # 正则大小写不敏感且容忍尾斜杠，覆盖 Express 默认路由行为；location 不含 add_header，
  # 因而继承 server 级 HSTS / Referrer-Policy / Permissions-Policy / nosniff。
  location ~* ^/api/v1/files/[^/]+/versions/[^/]+/preview-content/?$ {
    return 404;
  }

  location /api/v1 {
    # P1（GHSA-27r3-jxmh-p828）：API 不接收压缩请求体；在边缘拒绝，绝不剥离编码头后转发。
    if ($http_content_encoding !~* "^(identity)?$") { return 415; }
    client_max_body_size 257m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://api_backend;
  }
  location /auth {
    if ($http_content_encoding !~* "^(identity)?$") { return 415; }
    proxy_pass http://api_backend;
  }
  location = /healthz {
    if ($http_content_encoding !~* "^(identity)?$") { return 415; }
    proxy_pass http://api_backend;
  }
  location = /readyz {
    if ($http_content_encoding !~* "^(identity)?$") { return 415; }
    proxy_pass http://api_backend;
  }

  # ---- 对象存储同源门面（/libiaolink/ = 桶名；预签名直传 / 预览 / 下载原样透传，SigV4 口径见文件头）----
  location /libiaolink/ {
    proxy_pass http://minio_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # H1 S5：对象存储门面即使被顶层打开，也只能作为无脚本、无同源权限的 sandbox 文档。
    # 先隐去上游可能自带的同名头，保证这里只落一套服务端口径。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox; default-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  
  # ---- ONLYOFFICE 文档服务器门面（443 /onlyoffice/ → libiaolink-onlyoffice-docs:80 · 子路径反代）----
  # DS 9.4 子路径原生支持：X-Forwarded-Prefix / X-Forwarded-Host 生成带前缀地址（本地全链验证 2026-10-14）；
  # 查看器会话 wss 靠 Upgrade 透传；R6：/example/ 永不暴露（门面 404，DS 侧 EXAMPLE_ENABLED=false 兜底）。
  location = /onlyoffice/example/ { return 404; }
  location /onlyoffice/ {
    proxy_pass http://onlyoffice_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix /onlyoffice;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

# ---- SPA 静态（frontend build 产物挂载到 /srv/www；哈希路由，兜底 index.html）----
  root /srv/www;
  index index.html;
  # Pinned CAD viewer assets use native ES modules/import maps. Revalidate every
  # file together; missing modules must never fall through to SPA index.html.
  location ^~ /cad-viewer/ {
    try_files $uri =404;
    # 本 location 自带 add_header 后不继承 server 级头，显式保持同一安全口径。
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }
  location / {
    # H1 S5：SPA 应用入口最小放行。script-src 的 'wasm-unsafe-eval' 仅供 CAD 的
    # occt-import-js 编译本地 wasm；不引入 'unsafe-eval'，也不允许 SVG 等主动内容执行。
    # 本 location 新增 add_header 后不再继承 server 级 HSTS，故重复同一 HSTS 口径。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # 兜底 /index.html 不存在时显式 404（末项若无 =404，会内部重定向成环 → 500）
    try_files $uri /index.html =404;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# ---- 9443：MinIO 备用门面（内网直连 / 排障；浏览器主通道 = 443 的 /libiaolink/）----
server {
  listen 9443 ssl;
  server_name test-pm.libiaorobot.com;

  ssl_certificate     /etc/nginx/ssl/libiaorobot.com.pem;
  ssl_certificate_key /etc/nginx/ssl/libiaorobot.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;

  server_tokens off;
  client_max_body_size 0;          # 大文件直传不限流（对象大小由应用侧约束）

  # H1 S5：9443 备用门面与 443 的 /libiaolink/ 同口径，禁止主动内容与同源权限。
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Strict-Transport-Security;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  proxy_hide_header X-Powered-By;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  add_header Content-Security-Policy "sandbox; default-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    proxy_pass http://minio_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;   # 原样透传（含端口）：SigV4 签名校验依赖 host:port
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;        # 直传不落 nginx 临时盘
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

# ---- 443 兜底：未知 SNI 直接断开（不回显任何内容）----
server {
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/libiaorobot.com.pem;
  ssl_certificate_key /etc/nginx/ssl/libiaorobot.com.key;

  return 444;
}
