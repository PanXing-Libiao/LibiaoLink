# ============================================================
# LibiaoLink RustFS 1.0.3 隔离 POC 专用同源门面
# ------------------------------------------------------------
# 只在 127.0.0.1:9445 发布（SSH 隧道）。Host 原样透传，保证 SigV4
# 的 host / path 与客户端签名一致。不要复用为 MinIO 的 443 门面。
# ============================================================

resolver 127.0.0.11 valid=10s ipv6=off;

upstream rustfs_poc_backend {
  zone rustfs_poc_backend 64k;
  server rustfs-poc:9000 resolve;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://rustfs_poc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
  }
}
