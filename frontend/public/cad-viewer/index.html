<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD 模型查看器</title><link rel="stylesheet" href="core/style.css"><script type="importmap">{"imports":{"three":"./core/vendor/three.module.js"}}</script><style>header nav,#open,#file,aside>section.samples,#partialOffer{display:none!important}body{min-width:0}header{padding:10px 16px}main{min-height:0}aside{min-width:210px}.brand small{font-size:12px}@media(max-width:700px){aside{width:210px}.tools{flex-wrap:wrap}.toolbar{align-items:start}}/* Import diagnostics stay discoverable in Model information, without viewport banners. */
#nonMeshableTopNotice,#meshRepairTopNotice{display:none!important}
#modelInfo{margin-top:12px}
</style></head><body>
<header><div class="brand"><span class="mark">◈</span><div><strong>CAD 模型查看器</strong><small>文件版本由平台管理</small></div></div><nav aria-label="预览链路"><a href="/">统一模型（默认）</a> · <a href="?pipeline=legacy">旧链路对照</a> · <a href="?pipeline=ucd&direct=0">Direct 回退</a></nav><button id="cancelLoad" hidden>取消加载</button><button id="open" class="primary">打开本地文件</button><input type="file" id="file" hidden accept=".easm,.step,.stp,.dxf,.glb,.stl,.obj"></header>
<main><aside><section class="samples"><label for="sample">样例文件（EASM / STEP / DXF）</label><select id="sample"><option value="viola" selected>Viola · 独立解析</option><option value="colibri">Colibri · 独立解析</option><option value="verdin">Verdin · 独立解析</option><option value="assembly">总成 · 独立解析</option><optgroup label="真实 DXF 工程图"><option value="dxf_flange">QCAD 法兰图纸 · DXF R2018</option><option value="dxf_byblock">BYBLOCK/BYLAYER 块 · DXF</option><option value="dxf_r12">冻结图层演示 · DXF R12</option></optgroup></select><p>可打开 EASM、STEP、DXF、GLB、STL、OBJ。每种格式的能力边界见下方说明。</p></section><section id="stateControls" class="samples" hidden><label for="configuration">配置</label><select id="configuration"></select><label for="displayState">显示状态</label><select id="displayState"></select><p>切换会恢复该状态的文件显隐。</p></section><div class="treehead"><strong>零件 / 文件节点</strong><span id="nodecount">—</span></div><input id="search" type="search" placeholder="搜索名称…" aria-label="搜索零件或节点"><div id="tree" aria-label="模型结构"></div><div class="treefoot"><button id="showAll">全部显示</button><button id="reset">恢复初始</button></div></aside>
<section class="workspace"><div class="toolbar"><div class="filename"><strong id="filename">正在准备模型…</strong></div><div class="tools"><button id="ground" aria-pressed="false">选底面摆正</button><button id="clearGround" disabled>清除地面</button><button id="fit">适应视图</button><button id="wire" aria-pressed="false">三角网格</button></div></div>
<div id="viewport"><div class="viewlabel" id="viewlabel">透视视图 <span>· Z 向上</span></div><div id="busy" role="status">正在解析真实样本…</div><div id="error" role="alert" hidden></div><div class="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 单击选中</div></div>
<div class="selection"><div><small>当前选中</small><strong id="selected">尚未选择</strong></div><div class="tools"><button id="focus" disabled>定位选中</button><button id="dim" aria-pressed="false" disabled>淡化其余</button><button id="toggle" disabled>隐藏选中</button><button id="isolate" disabled>仅显示选中</button></div></div>
<div class="status"><span id="stats">—</span><span id="unit">—</span></div>
<details id="modelInfo" class="evidence"><summary>模型信息</summary><p id="quality">本地解析</p><button id="export">导出检查记录</button><div id="completeness" role="status" hidden></div><div id="partialOffer" hidden><span></span><button id="partialRetry">以部分预览重新解析</button></div><details class="evidence" open><summary>当前文件的解析范围</summary><p id="note"></p><p id="source"></p><div id="reference" hidden><p>原文件附带缩略图，仅作外观参考；不代表逐件对照已通过。</p><img  alt="eDrawings 原文件附带缩略图"></div></details>
</details></section></main><script>window.addEventListener("error",function(e){var b=document.getElementById("busy"),r=document.getElementById("error");if(b)b.hidden=true;if(r){r.hidden=false;r.textContent="页面运行异常："+(e.message||"本地依赖加载失败，请重新启动验证版");}},true);</script><script type="module" src="platform-entry.js"></script></body></html>
