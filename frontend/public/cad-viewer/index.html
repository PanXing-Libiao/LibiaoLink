<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CAD 模型查看器</title>
  <link rel="stylesheet" href="core/style.css">
  <link rel="stylesheet" href="platform.css">
  <script type="importmap">{"imports":{"three":"./core/vendor/three.module.js"}}</script>
</head>
<body data-cad-state="loading">
  <header class="viewer-header">
    <div class="file-heading">
      <span class="file-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg></span>
      <div class="filename"><strong id="filename">正在准备模型…</strong><small>CAD 模型 <span aria-hidden="true">·</span> <span id="sessionStatus">正在导入</span></small></div>
    </div>
    <div class="header-actions">
      <button id="downloadOriginal" title="下载原文件">下载原文件</button>
      <span class="header-divider" aria-hidden="true"></span>
      <button id="closeViewer" class="icon-button" aria-label="关闭模型" title="关闭模型（Esc）"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
    </div>
    <!-- Required by the independent viewer; platform files are opened by version. -->
    <button id="open" hidden>打开本地文件</button>
    <input type="file" id="file" hidden accept=".step,.stp">
  </header>
  <main>
    <button id="sidebarScrim" aria-label="收起零件结构" tabindex="-1"></button>
    <aside id="partsSidebar" aria-label="零件结构">
      <section class="samples" hidden><label for="sample">样例文件</label><select id="sample"><option value="viola">Viola</option></select><p></p></section>
      <section id="stateControls" class="samples" hidden><label for="configuration">配置</label><select id="configuration"></select><label for="displayState">显示状态</label><select id="displayState"></select><p></p></section>
      <div class="treehead"><strong>零件结构</strong><span id="nodecount">—</span><button id="closeSidebar" class="icon-button" aria-label="收起零件结构" title="收起零件结构"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
      <input id="search" type="search" placeholder="搜索零件名称" aria-label="搜索零件名称" aria-describedby="searchStatus">
      <p id="searchStatus" class="search-status" role="status" hidden></p>
      <div id="tree" aria-label="模型结构"></div>
      <div class="treefoot"><button id="showAll" title="恢复显示本次隐藏或隔离的零件">全部显示</button><button id="reset" title="恢复打开时的显隐状态，并调整到完整视图">恢复初始</button></div>
    </aside>
    <section class="workspace" aria-label="模型视图">
      <div class="toolbar">
        <button id="toggleSidebar" class="sidebar-toggle" aria-controls="partsSidebar" aria-expanded="true"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M8 3v14"/></svg><span>零件结构</span></button>
        <div class="tools" id="viewTools" role="group" aria-label="视图操作">
          <button id="fit" title="调整远近，让当前可见模型完整入镜">适应视图</button><button id="wire" aria-pressed="false" title="将表面切换为三角形线框，再点恢复实体显示">三角网格</button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button id="ground" aria-pressed="false" title="点击脚底或支撑面，按该面调整观看方向并添加参考地面">选底面摆正</button><button id="clearGround" title="移除参考地面" disabled>清除地面</button>
        </div>
      </div>
      <div id="viewport" aria-busy="true">
        <div class="viewlabel" id="viewlabel">透视视图 <span>· Z 向上</span></div>
        <div id="busy" role="status">正在准备模型…</div>
        <div class="import-overlay" id="importOverlay">
          <div class="import-card">
            <div class="import-symbol" aria-hidden="true"><img src="import-assembly.svg" width="144" height="120" alt=""></div>
            <h1>正在导入模型</h1>
            <p id="loadFilename" class="import-filename">正在读取文件信息…</p>
            <ol id="loadSteps" class="import-steps" aria-label="导入步骤"><li data-state="current" aria-current="step"><span>1</span>读取文件</li><li><span>2</span>处理模型</li><li><span>3</span>准备视图</li><li><span>4</span>完成</li></ol>
            <div class="import-progress-head"><strong id="loadStage">正在读取文件</strong><span id="loadMeasure">第 1 步 / 共 4 步</span></div>
            <div class="progress-track"><progress id="loadProgress" aria-label="模型处理进行中，当前没有可测量的完成百分比"></progress><span class="progress-indicator" aria-hidden="true"></span></div>
            <div class="import-time"><strong id="loadEta">读取文件后估算时间</strong><span id="loadElapsed">已用 0 秒</span></div>
            <p id="loadBasis" class="import-basis">正在准备文件与处理任务</p>
            <button id="cancelLoad" hidden>取消导入</button>
          </div>
        </div>
        <div id="error" role="alert" hidden></div>
        <div class="retry-actions" id="retryActions"><button id="retryImport" class="primary">重新打开</button></div>
        <div class="hint">拖动旋转 <span>·</span> 滚轮缩放 <span>·</span> 右键平移 <span>·</span> 单击选中</div>
      </div>
      <div class="selection" id="selectionTools">
        <div class="selected-label"><small>当前选中</small><strong id="selected">尚未选择</strong></div>
        <div class="tools" role="group" aria-label="选中零件操作"><button id="focus" title="将选中零件居中放大，其它零件保留" disabled>定位选中</button><button id="dim" aria-pressed="false" title="让其它零件变淡，保留装配位置关系；再点恢复" disabled>淡化其余</button><button id="toggle" title="切换选中零件的显示；可用全部显示找回" disabled>隐藏选中</button><button id="isolate" title="只显示选中零件或装配，隐藏其它；全部显示可恢复" disabled>仅显示选中</button></div>
      </div>
      <details id="modelInfo" class="evidence">
        <summary>模型信息</summary>
        <div class="model-info-body">
          <div class="name-encoding">
            <label for="nameCodepage">零件名称编码</label>
            <select id="nameCodepage" aria-describedby="nameEncodingHelp"><option value="UTF8">标准编码</option><option value="GB">中文旧编码</option></select>
            <button id="reloadNames" disabled>重新读取</button>
            <p id="nameEncodingHelp">中文名称显示异常时可切换编码。重新读取会加载模型，并记住本标签页内该文件版本的选择。</p>
          </div>
          <div class="status"><span id="stats">—</span><span id="unit">—</span></div>
          <p id="quality">本地解析</p><button id="export">导出检查记录</button>
          <div id="completeness" role="status" hidden></div>
          <div id="partialOffer" hidden><span></span><button id="partialRetry">以部分预览重新解析</button></div>
          <details class="evidence"><summary>当前文件的解析范围</summary><p id="note"></p><p id="source"></p><div id="reference" hidden><p>原文件附带缩略图，仅作外观参考。</p><img alt="原文件附带缩略图"></div></details>
        </div>
      </details>
    </section>
  </main>
  <p id="importAnnouncement" class="sr-only" role="status" aria-live="polite" aria-atomic="true">正在导入模型</p>
  <script>
    for (var entry of [['closeViewer', 'cad-close'], ['downloadOriginal', 'cad-download'], ['retryImport', 'cad-retry']]) {
      (function(id, type) { document.getElementById(id).onclick = function() { parent.postMessage({type: type}, location.origin); }; })(entry[0], entry[1]);
    }
    window.addEventListener('error', function(event) {
      document.body.dataset.cadState = 'failed';
      document.getElementById('viewport').setAttribute('aria-busy', 'false');
      document.getElementById('sessionStatus').textContent = '未打开';
      var error = document.getElementById('error');
      error.hidden = false;
      error.textContent = '页面运行异常：' + (event.message || '页面资源读取失败，请重新打开');
    }, true);
  </script>
  <script type="module" src="platform-entry.js"></script>
</body>
</html>
