<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 160" fill="none">
  <title>零件拼合与线框描绘</title>
  <style>
    .part { stroke: #347d8d; stroke-width: 1.25; stroke-linejoin: round; }
    .base { animation: base-in 4.8s ease-in-out infinite; }
    .body { animation: body-in 4.8s cubic-bezier(.22,.68,.2,1) infinite; }
    .cap { animation: cap-in 4.8s cubic-bezier(.22,.68,.2,1) infinite; }
    .trace { stroke: #237c90; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; animation: trace-in 4.8s ease-in-out infinite; }
    @keyframes base-in {
      0%, 100% { transform: translateY(8px); opacity: .2; }
      18%, 78% { transform: translateY(0); opacity: 1; }
      94% { transform: translateY(8px); opacity: .2; }
    }
    @keyframes body-in {
      0%, 10%, 100% { transform: translate(-22px,-25px); opacity: 0; }
      35%, 78% { transform: translate(0,0); opacity: 1; }
      94% { transform: translate(-22px,-25px); opacity: 0; }
    }
    @keyframes cap-in {
      0%, 27%, 100% { transform: translate(22px,-25px); opacity: 0; }
      52%, 78% { transform: translate(0,0); opacity: 1; }
      94% { transform: translate(22px,-25px); opacity: 0; }
    }
    @keyframes trace-in {
      0%, 48%, 100% { stroke-dashoffset: 100; opacity: 0; }
      53% { opacity: .9; }
      76% { stroke-dashoffset: 0; opacity: .9; }
      86%, 94% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .base, .body, .cap, .trace { animation: none; transform: none; opacity: 1; }
      .trace { stroke-dashoffset: 0; opacity: .35; }
    }
  </style>
  <g stroke="#b8cbd3" stroke-width=".8">
