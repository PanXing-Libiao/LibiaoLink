  </g>
  <g class="cap part">
    <path d="m66 49 30 15v6L66 55Z" fill="#d3e6eb"/>
    <path d="m96 64 30-15v6L96 70Z" fill="#95bdc9"/>
    <path d="m66 49 30-15 30 15-30 15Z" fill="#f4fafb"/>
    <ellipse cx="96" cy="49" rx="8" ry="4" fill="#c0dce4"/>
  </g>
  <path class="trace" pathLength="100" d="m66 49 30-15 30 15v6l-30 15-30-15v-6l30 15 30-15M96 64v6m34 0v25l26 13v7l-60 30-60-30v-7l26-13V70m-26 38 60 30 60-30M96 138v7"/>
