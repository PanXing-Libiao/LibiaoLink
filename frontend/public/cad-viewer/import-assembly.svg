    <path d="m96 138 60-30v7l-60 30Z" fill="#a9c6d0"/>
    <path d="m36 108 60-30 60 30-60 30Z" fill="#ecf3f6"/>
    <path d="m49 108 47-23 47 23-47 23Z" stroke="#b2cdd7" stroke-width=".8"/>
    <ellipse cx="53" cy="109" rx="3" ry="1.5" fill="#f4f7f9"/>
    <ellipse cx="139" cy="109" rx="3" ry="1.5" fill="#f4f7f9"/>
  </g>
  <g class="body part">
    <path d="m62 70 34 17v25L62 95Z" fill="#a8ccd5"/>
    <path d="m96 87 34-17v25l-34 17Z" fill="#78aebb"/>
