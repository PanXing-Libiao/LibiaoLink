    <path d="m58 92 76 38M134 92l-76 38M96 17v128" stroke-dasharray="2 5" opacity=".6"/>
    <path d="M16 111h8m-4-4v8m148-4h8m-4-4v8M92 149h8m-4-4v8"/>
  </g>
  <g class="base part">
