name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 脚本语法门禁：scripts/**/*.mjs 不在 typecheck / build 覆盖内；`node --check` 一次只检查第一个文件，必须逐个跑。
      - name: Script syntax gate (*.mjs)
        run: |
          set -euo pipefail
          find scripts -type f -name "*.mjs" -print0 | xargs -0 -r -n1 node --check
      - name: Install (locked)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # H1 S6：真实 Postgres / MinIO / preview.job / worker / svg-preview / Nginx / Headless Chrome。
  # ONLYOFFICE 仅以本地 api.js 桩打通外壳生命周期；真实 DocServer 文档渲染与真实 CAD 生产样本
  # 仍属发布窗口人工项。请 px 复核 .github / Nginx 派生与 artifact 脱敏；wmj 复核安全断言。
  svg-preview-e2e:
    name: svg-preview-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: libiaolink
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d libiaolink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/package-lock.json
            server/package-lock.json
            database/package-lock.json
            deploy/svg-preview/package-lock.json
      - name: Script syntax gate (*.mjs)
        working-directory: frontend
        run: |
          set -euo pipefail
          find scripts -type f -name "*.mjs" -print0 | xargs -0 -r -n1 node --check
      - name: Install shared (locked)
        working-directory: shared
        run: npm ci
      - name: Build shared
        working-directory: shared
        run: npm run build
      - name: Install server (locked)
        working-directory: server
        run: npm ci
      - name: Build server
        working-directory: server
        run: npm run build
      - name: Install database (locked)
        working-directory: database
        run: npm ci
      - name: Install frontend (locked)
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install svg-preview converter (locked)
        working-directory: deploy/svg-preview
        run: npm ci
      - name: Install integration runtime packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx fonts-noto-cjk postgresql-client
          sudo systemctl stop nginx 2>/dev/null || true
          test -x /usr/bin/google-chrome
      - name: Generate localhost TLS certificate
        run: |
          mkdir -p /tmp/h1-certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/h1-certs/localhost-key.pem \
            -out /tmp/h1-certs/localhost.pem \
            -subj "/CN=localhost" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign" \
            -addext "extendedKeyUsage=serverAuth" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 600 /tmp/h1-certs/localhost-key.pem
      - name: Apply database roles
        run: psql "postgresql://postgres@127.0.0.1:5432/libiaolink" -v ON_ERROR_STOP=1 -f database/roles/0001_roles.sql
      - name: Migrate empty database
        working-directory: database
        env:
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/migrate.mjs
      - name: Seed base data
        working-directory: database
        env:
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/seed.mjs
      - name: Download MinIO (pinned release + SHA-256)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z \
            -o /tmp/minio
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  /tmp/minio" | sha256sum --check --strict
          chmod +x /tmp/minio
      - name: Start MinIO
        run: |
          set -euo pipefail
          mkdir -p /tmp/h1-minio-data
          setsid nohup env \
            MINIO_ROOT_USER=libiaolink \
            MINIO_ROOT_PASSWORD=libiaolink-dev-secret \
            MINIO_API_CORS_ALLOW_ORIGIN=https://localhost \
            /tmp/minio server /tmp/h1-minio-data \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            > /tmp/h1-minio.log 2>&1 < /dev/null &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "MinIO ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          tail -n 80 /tmp/h1-minio.log
          exit 1
      - name: Start ONLYOFFICE stub and SVG converter
        run: |
          set -euo pipefail
          setsid nohup node frontend/scripts/h1-onlyoffice-stub.mjs \
            > /tmp/h1-onlyoffice.log 2>&1 < /dev/null &
          (
            cd deploy/svg-preview
            setsid nohup env \
              FONTS_DIR=/usr/share/fonts/opentype/noto \
              PORT=9900 HOST=127.0.0.1 PIPELINE_VERSION=2.0.0 \
              node service/server.mjs \
              > /tmp/h1-svg-preview.log 2>&1 < /dev/null &
          )
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/healthz > /dev/null && \
               curl -fsS http://127.0.0.1:9900/healthz > /dev/null; then
              echo "ONLYOFFICE stub / converter ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          tail -n 80 /tmp/h1-onlyoffice.log /tmp/h1-svg-preview.log
          exit 1
      - name: Generate and start Nginx from production config
        run: |
          set -euo pipefail
          node frontend/scripts/h1-nginx-ci-config.mjs
          sudo nginx -t -c /tmp/h1-nginx.conf
          sudo nginx -c /tmp/h1-nginx.conf
          for attempt in $(seq 1 30); do
            if curl -kfsS https://localhost/nginx-health > /dev/null; then
              echo "Nginx ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          sudo tail -n 80 /tmp/h1-nginx-error.log
          exit 1
      - name: Initialize object storage
        working-directory: server
        env:
          NODE_EXTRA_CA_CERTS: /tmp/h1-certs/localhost.pem
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
          S3_ENDPOINT: https://localhost
          S3_REGION: us-east-1
          S3_BUCKET: libiaolink
          S3_ACCESS_KEY: libiaolink
          S3_SECRET_KEY: libiaolink-dev-secret
          S3_CORS_ORIGINS: https://localhost
        run: node scripts/storage-init.mjs
      - name: Start api
        working-directory: server
        env:
          NODE_EXTRA_CA_CERTS: /tmp/h1-certs/localhost.pem
          NODE_ENV: test
          PORT: "3011"
          LOG_LEVEL: warn
          DATABASE_URL: postgresql://libiaolink_api@127.0.0.1:5432/libiaolink
          S3_ENDPOINT: https://localhost
          S3_REGION: us-east-1
          S3_BUCKET: libiaolink
          S3_ACCESS_KEY: libiaolink
          S3_SECRET_KEY: libiaolink-dev-secret
          PREVIEW_CONVERTER_URL: http://127.0.0.1:9900
          PREVIEW_PIPELINE_VERSION: 2.0.0
          PREVIEW_CONVERT_TIMEOUT_MS: "15000"
          PREVIEW_CONVERT_BACKOFF_MS: "1000"
          OUTBOX_POLL_MS: "500"
          OUTBOX_STALE_MS: "60000"
          ONLYOFFICE_JWT_SECRET: non-empty-test-secret
          ONLYOFFICE_DOCSERVER_URL: https://localhost/onlyoffice
          ONLYOFFICE_DOCSERVER_API_BASE_URL: https://localhost
        run: |
          set -euo pipefail
          setsid nohup node dist/entry/api.js > /tmp/h1-api.log 2>&1 < /dev/null &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3011/healthz > /dev/null; then
              echo "api ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          tail -n 100 /tmp/h1-api.log
          exit 1
      - name: Start worker
        working-directory: server
        env:
          NODE_EXTRA_CA_CERTS: /tmp/h1-certs/localhost.pem
          NODE_ENV: test
          LOG_LEVEL: info
          DATABASE_URL: postgresql://libiaolink_api@127.0.0.1:5432/libiaolink
          S3_ENDPOINT: https://localhost
          S3_REGION: us-east-1
          S3_BUCKET: libiaolink
          S3_ACCESS_KEY: libiaolink
          S3_SECRET_KEY: libiaolink-dev-secret
          PREVIEW_CONVERTER_URL: http://127.0.0.1:9900
          PREVIEW_PIPELINE_VERSION: 2.0.0
          PREVIEW_CONVERT_TIMEOUT_MS: "15000"
          PREVIEW_CONVERT_BACKOFF_MS: "1000"
          OUTBOX_POLL_MS: "500"
          OUTBOX_STALE_MS: "60000"
          ONLYOFFICE_JWT_SECRET: non-empty-test-secret
          ONLYOFFICE_DOCSERVER_URL: https://localhost/onlyoffice
          ONLYOFFICE_DOCSERVER_API_BASE_URL: https://localhost
        run: |
          set -euo pipefail
          node dist/entry/worker.js --health-check
          setsid nohup node dist/entry/worker.js > /tmp/h1-worker.log 2>&1 < /dev/null &
          for attempt in $(seq 1 60); do
            if grep -q "worker 已启动" /tmp/h1-worker.log; then
              echo "worker ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          tail -n 100 /tmp/h1-worker.log
          exit 1
      - name: Run H1 S6 browser regression
        working-directory: frontend
        env:
          NODE_EXTRA_CA_CERTS: /tmp/h1-certs/localhost.pem
          H1_BASE_URL: https://localhost
          H1_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
          H1_S3_ENDPOINT: https://localhost
          H1_S3_REGION: us-east-1
          H1_S3_BUCKET: libiaolink
          H1_S3_ACCESS_KEY: libiaolink
          H1_S3_SECRET_KEY: libiaolink-dev-secret
          H1_REQUIRE_HEADERS: "1"
          H1_BACKUP_STORAGE_PORT: "9443"
          H1_ARTIFACT_DIR: /tmp/h1-svg-preview-e2e
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run preview:svg-e2e
      - name: Collect H1 diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p frontend/h1-artifacts
          if [ -d /tmp/h1-svg-preview-e2e ]; then
            cp -a /tmp/h1-svg-preview-e2e/. frontend/h1-artifacts/
          fi
          : > frontend/h1-artifacts/service-logs.txt
          for spec in \
            api:/tmp/h1-api.log \
            worker:/tmp/h1-worker.log \
            nginx-error:/tmp/h1-nginx-error.log \
            nginx-access:/tmp/h1-nginx-access.log \
            minio:/tmp/h1-minio.log \
            onlyoffice:/tmp/h1-onlyoffice.log \
            svg-preview:/tmp/h1-svg-preview.log; do
            name=${spec%%:*}
            file=${spec#*:}
            printf '\n===== %s =====\n' "$name" >> frontend/h1-artifacts/service-logs.txt
            if [ -f "$file" ]; then
              tail -n 800 "$file" >> frontend/h1-artifacts/service-logs.txt
            else
              echo "(missing: $file)" >> frontend/h1-artifacts/service-logs.txt
            fi
          done
          find frontend/h1-artifacts -type f \( -name "*.log" -o -name "*.txt" -o -name "*.json" \) -print0 \
            | xargs -0 -r sed -E -i \
                -e 's/([?&](X-Amz-[^=& ]+|token|Signature|Credential|Security-Token|Expires)=)[^& ]+/\1[REDACTED]/g' \
                -e 's/(ll_sid|ll_csrf)=[^; ,"\x27]+/\1=[REDACTED]/g' \
                -e 's/(authorization:[[:space:]]*bearer[[:space:]]+)[^ ,"]+/\1[REDACTED]/Ig'
      - name: Upload H1 evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-svg-preview-e2e-${{ github.run_id }}
          path: frontend/h1-artifacts
          if-no-files-found: warn
          retention-days: 7

  shared:
    name: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Contract drift check
        run: npm run check
      # 契约回放（Zod 层，无 DB / 无 HTTP）：写入端/白名单漂移、上传 intent 矩阵、预览三态矩阵。
      - name: Contract replays (net-free)
        run: |
          set -euo pipefail
          node scripts/upload-intent-replay.mjs
          node scripts/preview-status-replay.mjs
          node scripts/outbox-contract-replay.mjs

  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            server/package-lock.json
      # 脚本语法门禁：scripts/**/*.mjs 不在 typecheck / vitest / build / 边界规则覆盖内（PR-3b 复验教训）。
      # `node --check` 一次只检查第一个文件，多文件必须逐个跑。
      - name: Script syntax gate (*.mjs)
        working-directory: server
        run: |
          set -euo pipefail
          find scripts -type f -name "*.mjs" -print0 | xargs -0 -r -n1 node --check
      - name: Install shared (locked)
        working-directory: shared
        run: npm ci
      - name: Build shared
        working-directory: shared
        run: npm run build
      - name: Install (locked)
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Tests
        working-directory: server
        run: npm run test
      - name: Build
        working-directory: server
        run: npm run build
      # 企微内核 stub 回放（M5-03-1 · 无网络 / 无 PG：本机 HTTP 桩模拟 gettoken / message/send，
      # 覆盖失败分类 / token 重取 / 限速短路分支）。脚本语法面由上方 syntax gate 覆盖。
      - name: WeCom kernel stub replay (net-free)
        working-directory: server
        run: node scripts/m5-03-1-wecom-stub-replay.mjs
      # 智能机器人长连接 stub 回放（M5-03-2 · 无网络 / 无 PG：假 socket 驱动客户端，
      # 覆盖订阅 / 推送帧 / 846607 双语义 / 限速短路 / 心跳重连 / stop 清理）。
      - name: WeCom aibot stub replay (net-free)
        working-directory: server
        run: node scripts/m5-03-2-aibot-stub-replay.mjs
      # 群播报接线段回放（M5-03-2 接线段 · 无网络 / 无 PG：假仓储 / 假长连接端子驱动消费链，
      # 覆盖三分类 / 未绑定与停用 / 回调 ingest / dispatcher deferred 收敛）。
      - name: WeCom group delivery replay (net-free)
        working-directory: server
        run: node scripts/m5-03-2-group-replay.mjs
      # 应用消息 + 告警出口回放（M5-03-3 · 无网络 / 无 PG：假仓储 / 假 HTTP 客户端 / 假站内信驱动应用消费链，
      # 覆盖三分类 / C5-04 降级 / 收件人不可投递 / 渠道路由防御 / 告警抑制与回退 · lan 线，Push 226）：
      # 请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: WeCom app delivery replay (net-free)
        working-directory: server
        run: node scripts/m5-03-3-app-replay.mjs
      # 单聊 aibot 实现段回放（M5-03-5-3 · 无网络 / 无 PG：假 socket + 假仓储驱动单聊发送/消费链，
      # 覆盖帧形锁帧 P4 / 846607 分流 / single 限速 / 三分类降级 · lan 线，Push 237）：
      # 请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: WeCom dm aibot replay (net-free)
        working-directory: server
        run: node scripts/m5-03-5-dm-replay.mjs
      - name: Boundary rules
        working-directory: server
        run: npm run check:boundaries

  # 数据库门禁：空库迁移 + Drizzle 结构漂移（加迁移 0005+ 的卡片必须在此 job 全绿）。
  # postgres:18 service（trust）→ 角色脚本 → 空库迁移 → 幂等复跑 → server 的 check:db-schema
  # （以 libiaolink_api 连接，顺带校验角色脚本的默认授权）。
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: libiaolink
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d libiaolink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            server/package-lock.json
            database/package-lock.json
      # 脚本语法门禁：scripts/ 与 seeds/ 下的 .mjs 不在 typecheck / 迁移门禁覆盖内；`node --check` 必须逐个跑。
      - name: Script syntax gate (*.mjs)
        working-directory: database
        run: |
          set -euo pipefail
          find scripts seeds -type f -name "*.mjs" -print0 | xargs -0 -r -n1 node --check
      - name: Install shared (locked)
        working-directory: shared
        run: npm ci
      - name: Build shared
        working-directory: shared
        run: npm run build
      - name: Install server (locked)
        working-directory: server
        run: npm ci
      - name: Build server (drizzle schema)
        working-directory: server
        run: npm run build
      - name: Install database (locked)
        working-directory: database
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply roles (idempotent)
        run: psql "postgresql://postgres@127.0.0.1:5432/libiaolink" -v ON_ERROR_STOP=1 -f database/roles/0001_roles.sql
      - name: Migrate empty database
        working-directory: database
        env:
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/migrate.mjs
      - name: Migrate re-run (idempotence + drift guard)
        working-directory: database
        env:
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/migrate.mjs
      - name: Schema drift check (Drizzle vs migrated DB, as libiaolink_api)
        working-directory: server
        env:
          DATABASE_URL: postgresql://libiaolink_api@127.0.0.1:5432/libiaolink
        run: npm run check:db-schema
      # ---- 真机回放（M3-06 压测 / M6 日报与问题）：空库种子 + 起 api + 脚本自证（报告逐行落 CI 日志） ----
      - name: Seed base data (roles / dicts / blueprint)
        working-directory: database
        env:
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/seed.mjs
      # M5-06-2A（消息级发送归档 / 回填 / outbox 清理 · S8-4 · lan，Push 272）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      # 2A / 2B 均为 DB-only；必须放在启动 API 之前，避免 worker 抢先消费回放写入的 outbox。
      - name: M5-06-2A delivery archive replay
        working-directory: server
        env:
          M5_06_2A_REPLAY_DATABASE_URL: postgresql://libiaolink_api@127.0.0.1:5432/libiaolink
        run: node scripts/m5-06-2a-replay.mjs
      # M5-06-2B（发送记录读面 / 幂等重发 · S8-4 · lan，Push 273）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      # 使用迁移器执行 DB-only 回放；真实权限 HTTP 9/9 已在本地以 PERMISSION_ENFORCED=true 复证。
      - name: M5-06-2B delivery records replay
        working-directory: server
        env:
          M5_06_2B_REPLAY_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/m5-06-2b-replay.mjs
      # M5-06-3（A14 待办主体 / 重复展开 / A01 已提醒回读 · S8-4 · lan，Push 276）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      # 使用应用角色走真实读写；必须在启动 API / 其它业务回放之前跑，夹具在脚本 finally 中清理。
      - name: M5-06-3 todo reminders replay
        working-directory: server
        env:
