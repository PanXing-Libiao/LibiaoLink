name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 脚本语法门禁：scripts/**/*.mjs 不在 typecheck / build 覆盖内；`node --check` 一次只检查第一个文件，必须逐个跑。
      - name: Script syntax gate (*.mjs)
        run: |
          set -euo pipefail
          find scripts -type f -name "*.mjs" -print0 | xargs -0 -r -n1 node --check
      - name: Install (locked)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  shared:
    name: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Contract drift check
        run: npm run check
      # 契约回放（Zod 层，无 DB / 无 HTTP）：写入端/白名单漂移、上传 intent 矩阵、预览三态矩阵。
      - name: Contract replays (net-free)
        run: |
          set -euo pipefail
          node scripts/upload-intent-replay.mjs
          node scripts/preview-status-replay.mjs
          node scripts/outbox-contract-replay.mjs

  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            server/package-lock.json
      # 脚本语法门禁：scripts/**/*.mjs 不在 typecheck / vitest / build / 边界规则覆盖内（PR-3b 复验教训）。
      # `node --check` 一次只检查第一个文件，多文件必须逐个跑。
      - name: Script syntax gate (*.mjs)
        working-directory: server
        run: |
          set -euo pipefail
          find scripts -type f -name "*.mjs" -print0 | xargs -0 -r -n1 node --check
      - name: Install shared (locked)
        working-directory: shared
        run: npm ci
      - name: Build shared
        working-directory: shared
        run: npm run build
      - name: Install (locked)
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Tests
        working-directory: server
        run: npm run test
      - name: Build
        working-directory: server
        run: npm run build
      # 企微内核 stub 回放（M5-03-1 · 无网络 / 无 PG：本机 HTTP 桩模拟 gettoken / message/send，
      # 覆盖失败分类 / token 重取 / 限速短路分支）。脚本语法面由上方 syntax gate 覆盖。
      - name: WeCom kernel stub replay (net-free)
        working-directory: server
        run: node scripts/m5-03-1-wecom-stub-replay.mjs
      # 智能机器人长连接 stub 回放（M5-03-2 · 无网络 / 无 PG：假 socket 驱动客户端，
      # 覆盖订阅 / 推送帧 / 846607 双语义 / 限速短路 / 心跳重连 / stop 清理）。
      - name: WeCom aibot stub replay (net-free)
        working-directory: server
        run: node scripts/m5-03-2-aibot-stub-replay.mjs
      # 群播报接线段回放（M5-03-2 接线段 · 无网络 / 无 PG：假仓储 / 假长连接端子驱动消费链，
      # 覆盖三分类 / 未绑定与停用 / 回调 ingest / dispatcher deferred 收敛）。
      - name: WeCom group delivery replay (net-free)
        working-directory: server
        run: node scripts/m5-03-2-group-replay.mjs
      # 应用消息 + 告警出口回放（M5-03-3 · 无网络 / 无 PG：假仓储 / 假 HTTP 客户端 / 假站内信驱动应用消费链，
      # 覆盖三分类 / C5-04 降级 / 收件人不可投递 / 渠道路由防御 / 告警抑制与回退 · lan 线，Push 226）：
      # 请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: WeCom app delivery replay (net-free)
        working-directory: server
        run: node scripts/m5-03-3-app-replay.mjs
      # 单聊 aibot 实现段回放（M5-03-5-3 · 无网络 / 无 PG：假 socket + 假仓储驱动单聊发送/消费链，
      # 覆盖帧形锁帧 P4 / 846607 分流 / single 限速 / 三分类降级 · lan 线，Push 237）：
      # 请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: WeCom dm aibot replay (net-free)
        working-directory: server
        run: node scripts/m5-03-5-dm-replay.mjs
      - name: Boundary rules
        working-directory: server
        run: npm run check:boundaries

  # 数据库门禁：空库迁移 + Drizzle 结构漂移（加迁移 0005+ 的卡片必须在此 job 全绿）。
  # postgres:18 service（trust）→ 角色脚本 → 空库迁移 → 幂等复跑 → server 的 check:db-schema
  # （以 libiaolink_api 连接，顺带校验角色脚本的默认授权）。
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: libiaolink
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d libiaolink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            server/package-lock.json
            database/package-lock.json
      # 脚本语法门禁：scripts/ 与 seeds/ 下的 .mjs 不在 typecheck / 迁移门禁覆盖内；`node --check` 必须逐个跑。
      - name: Script syntax gate (*.mjs)
        working-directory: database
        run: |
          set -euo pipefail
          find scripts seeds -type f -name "*.mjs" -print0 | xargs -0 -r -n1 node --check
      - name: Install shared (locked)
        working-directory: shared
        run: npm ci
      - name: Build shared
        working-directory: shared
        run: npm run build
      - name: Install server (locked)
        working-directory: server
        run: npm ci
      - name: Build server (drizzle schema)
        working-directory: server
        run: npm run build
      - name: Install database (locked)
        working-directory: database
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply roles (idempotent)
        run: psql "postgresql://postgres@127.0.0.1:5432/libiaolink" -v ON_ERROR_STOP=1 -f database/roles/0001_roles.sql
      - name: Migrate empty database
        working-directory: database
        env:
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/migrate.mjs
      - name: Migrate re-run (idempotence + drift guard)
        working-directory: database
        env:
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/migrate.mjs
      - name: Schema drift check (Drizzle vs migrated DB, as libiaolink_api)
        working-directory: server
        env:
          DATABASE_URL: postgresql://libiaolink_api@127.0.0.1:5432/libiaolink
        run: npm run check:db-schema
      # ---- 真机回放（M3-06 压测 / M6 日报与问题）：空库种子 + 起 api + 脚本自证（报告逐行落 CI 日志） ----
      - name: Seed base data (roles / dicts / blueprint)
        working-directory: database
        env:
          DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/seed.mjs
      - name: Start api in background
        working-directory: server
        env:
          NODE_ENV: test
          PORT: "3011"
          LOG_LEVEL: warn
          DATABASE_URL: postgresql://libiaolink_api@127.0.0.1:5432/libiaolink
          # SSE 心跳周期收紧（M5-04-1 回放 S6 断言；生产缺省 25s —— S8-3 定案 §三-4）
          NOTIFY_STREAM_HEARTBEAT_MS: "1500"
        run: |
          set -euo pipefail
          setsid nohup node dist/entry/api.js > api.log 2>&1 < /dev/null &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3011/healthz > /dev/null; then
              echo "api ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "api 未在 60s 内就绪；日志尾部："
          tail -n 80 api.log
          exit 1
      # M5-06-1B（规则管理 / 只读试运行 / 运行记录 · S8-4 · lan 代做 wmj 线，Push 271）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      # 必须放在 M3-06 / M6 之前：调度型试运行按全库任务主体池取前 100 个，早期库只有本回放夹具，断言不受其它回放污染。
      - name: M5-06-1B automation rules replay (list / patch / trial / runs + HTTP)
        working-directory: server
        env:
          M5_06_1B_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
          M5_06_1B_BASE_URL: http://127.0.0.1:3011
        run: node scripts/m5-06-1b-replay.mjs
      - name: M3-06 stress replay (10k tasks + index comparison)
        working-directory: server
        env:
          M3_STRESS_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
          M3_STRESS_BASE_URL: http://127.0.0.1:3011
        run: node scripts/m3-06-stress.mjs
      - name: M6 replay (daily reports + issues)
        working-directory: server
        env:
          M6_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
          M6_BASE_URL: http://127.0.0.1:3011
        run: node scripts/m6-replay.mjs
      # M2-06（视图 + 关注 · wmj 线，Push 168）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: M2-06 replay (views + follows)
        working-directory: server
        env:
          M2_06_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
          M2_06_BASE_URL: http://127.0.0.1:3011
        run: node scripts/m2-06-replay.mjs
      # S7-2（PoC-4 投递语义 / PoC-5 50 并发领取 · i6 / i7 · lan 线，Push 176）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: S7-2 PoC-4 replay (outbox delivery semantics)
        working-directory: server
        env:
          POC4_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/poc4-outbox-replay.mjs
      - name: S7-2 PoC-5 replay (PG queue 50-way concurrent claim + bloat/vacuum)
        working-directory: server
        env:
          POC5_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/poc5-outbox-concurrency.mjs
      # S7-3（调度 / 补发 / 幂等执行键 / 状态回退再生窗口 · i11 / M5-02 · lan 线，Push 177）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: S7-3 scheduler replay (cron catch-up + single-active lock + replay idempotence)
        working-directory: server
        env:
          S7_3_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/s7-3-scheduler-replay.mjs
      # S7-4（通知投递：站内信收件箱 / 合并 / 免打扰 / 每日上限 · j1 / M5-04 首刀 · lan 线，Push 178）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: S7-4 notify replay (inbox + merge + quiet hours + daily limit)
        working-directory: server
        env:
          S7_4_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/s7-4-notify-replay.mjs
      # S7-4 接线（规则事件消费 RULE_EVENT_TOPICS + automation-schedule.job → notify.message 生产 · M5-02 接线段 · lan 线，Push 180）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: S7-4 automation wiring replay (rule event consumers + schedule producer)
        working-directory: server
        env:
          S7_4_WIRING_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
        run: node scripts/s7-4-automation-wiring-replay.mjs
      # M5-04-1（SSE 实时推送：notification / unread 事件扇出 + 每用户连接上限 + 心跳 · S8-3 · lan 线，Push 211）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: M5-04-1 SSE replay (stream fan-out + per-user limit + heartbeat)
        working-directory: server
        env:
          M5_04_1_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
          M5_04_1_BASE_URL: http://127.0.0.1:3011
        run: node scripts/m5-04-1-sse-replay.mjs
      # M5-04-2（稍后提醒：端点三件套 + 迁移 0045 + 触发循环 + SSE 联动 · S8-3 · lan 线，Push 212）：请 px 复核（.github/ 属 px 线；先例 Push 156/157）
      - name: M5-04-2 snooze replay (set / cancel / trigger / quiet deferral / handled + SSE)
        working-directory: server
        env:
          M5_04_2_DATABASE_URL: postgresql://libiaolink_migrator@127.0.0.1:5432/libiaolink
          M5_04_2_BASE_URL: http://127.0.0.1:3011
        run: node scripts/m5-04-2-snooze-replay.mjs
